server:
  port: 8081

spring:
  application:
    name: interviewcraft-auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/interviewcraft_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:InterviewCraftSecretKeyForJWTGenerationMustBeAtLeast256BitsLongForHMACSHA256Security}
  expiration: 86400000

logging:
  level:
    com.interviewcraft: DEBUG
    org.springframework.security: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
