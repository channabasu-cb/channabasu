version: '3.8'

services:
  # -------------------------------------------------------------
  # PostgreSQL (Primary Relational Database)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: bangalore-dairy-postgres
    environment:
      POSTGRES_USER: dairy_admin
      POSTGRES_PASSWORD: dairy_password_123
      POSTGRES_DB: bangalore_dairy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - dairy-network

  # -------------------------------------------------------------
  # MongoDB (NoSQL Document Store for Catalog & Delivery Logs)
  # -------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: bangalore-dairy-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: mongo_password_123
      MONGO_INITDB_DATABASE: bangalore_dairy_catalog
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - dairy-network

  # -------------------------------------------------------------
  # Redis (Cache Layer for Products & Session Store)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: bangalore-dairy-redis
    command: redis-server --requirepass redis_password_123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dairy-network

  # -------------------------------------------------------------
  # Apache Kafka (KRaft Mode - No Zookeeper needed)
  # -------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: bangalore-dairy-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - dairy-network

  # -------------------------------------------------------------
  # Kafka UI (Visual Dashboard for Kafka Topics and Messages)
  # -------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: bangalore-dairy-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: bangalore-dairy-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - dairy-network

  # -------------------------------------------------------------
  # Mailpit (Local SMTP Server & Web UI for Email Notifications)
  # -------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: bangalore-dairy-mailpit
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI for viewing emails
    networks:
      - dairy-network

  # -------------------------------------------------------------
  # API Gateway Service (Port 8080)
  # -------------------------------------------------------------
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: bangalore-dairy-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - auth-service
      - catalog-service
      - order-service
      - notification-service
    networks:
      - dairy-network

  # -------------------------------------------------------------
  # Auth Service (Port 8081)
  # -------------------------------------------------------------
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: bangalore-dairy-auth
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/bangalore_dairy_db
    depends_on:
      - postgres
      - redis
    networks:
      - dairy-network

  # -------------------------------------------------------------
  # Catalog Service (Port 8082)
  # -------------------------------------------------------------
  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    container_name: bangalore-dairy-catalog
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_MONGODB_URI=mongodb://mongo_admin:mongo_password_123@mongodb:27017/bangalore_dairy_catalog?authSource=admin
    depends_on:
      - redis
      - mongodb
      - postgres
    networks:
      - dairy-network

  # -------------------------------------------------------------
  # Order & Subscription Service (Port 8083)
  # -------------------------------------------------------------
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: bangalore-dairy-order
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/bangalore_dairy_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - postgres
      - kafka
    networks:
      - dairy-network

  # -------------------------------------------------------------
  # Notification & Email Service (Port 8084)
  # -------------------------------------------------------------
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: bangalore-dairy-notification
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_MAIL_HOST=mailpit
      - SPRING_MAIL_PORT=1025
    depends_on:
      - kafka
      - mailpit
    networks:
      - dairy-network

networks:
  dairy-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:
